name: auto-imdb-sync

# Rebuilds the IMDb index from IMDb's daily datasets (refreshed around 12:30 UTC) into the production database, and on demand.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  auto-imdb-sync:
    name: Sync the IMDb index
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Sync
        run: bun run imdb:sync
        env:
          NODE_ENV: production
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          SKIP_ENV_VALIDATION_SERVER: "true"
